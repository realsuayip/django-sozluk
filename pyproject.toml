[project]
name = "django-sozluk"
version = "1.7.0"
requires-python = "==3.14.*"
dependencies = [
    "django ~= 5.2",
    "django-uuslug ~= 2.0",
    "django-widget-tweaks~=1.5",
    "graphene-django~=3.2",
    "python-dateutil~=2.9",
    "user-agents~=2.2",
    "pillow~=11.3",
    "celery~=5.5",
    "django-celery-email~=3.0",
    "psycopg[c]~=3.2",
    "django-redis~=6.0",
    "gunicorn~=23.0"
]

[tool.ruff]
fix = true
show-fixes = true
target-version = "py314"
line-length = 120

[tool.ruff.lint]
fixable = ["I"]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "RUF", # Ruff-specific
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "I", # isort
    "N", # pep8-naming
    "BLE", # flake8-blind-except
    "DTZ", # flake8-datetimez
    "DJ", # flake8-django
    "FA", # flake8-future-annotations
    "G", # flake8-logging-format
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL", # pylint
    "PERF", # perflint
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "TC", # flake8-type-checking
    "UP", # pyupgrade
    "FURB", # refurb
]
ignore = ["B904", "RUF001", "RUF012","RUF003", "RUF005", "B905"]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.extend-per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.lint.mccabe]
max-complexity = 20
